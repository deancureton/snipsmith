- trigger: table([1-9]{1}) ([1-9]{1})
  replacement: "\\begin{table}[H]\n\t\\centering\n\t\\begin{tabular}{``let len = m[2];\
    \ let results = \"\"; for(var i=0; i<len-1; i++){ results += \"c|\"} results +=\
    \ \"c\"; rv = results;``}\n\t    \\toprule\n\t\t\t``let order = 1; nrow = m[1];\
    \ ncol = m[2]; for (var i=0; i<nrow-1; i++){ for(var j = 0;j <ncol-1;j++){ rv\
    \ += `${snip.tabstop(order+3)} & `; order ++;}\trv += ` ${snip.tabstop(order+3)}\
    \ \\\\\\\\`+ `\\\\`+ `\\n`; order ++; if(i == 0){ rv += `\t\t\\\\midrule` + `\\\
    n`; } rv += `\t\t\t`; }\tfor(var j = 0;j <ncol-1;j++){ rv += `${snip.tabstop(order+3)}\
    \ & `; order ++;} rv += ` ${snip.tabstop(order+3)} \\\\\\\\` + `\\\\`;``\n   \
    \ \t\\bottomrule\n\t\\end{tabular}\n\t\\caption{${2:caption}}\n\t\\label{tab:${3:label}}\n\
    \\end{table}\n"
  description: Table environment
  regex: true
  target_platforms:
  - vscode
  options:
    text: true
    beginning_of_line: true
- trigger: ary([1-9]{1}) ([1-9]{1})
  replacement: "\\begin{array}{``let len = m[2]; let results = \"\"; for(var i=0;\
    \ i<len; i++){ results += \"c\"} rv = results;``}\n``let order = 1; let nrow =\
    \ m[1]; let ncol = m[2]; for (var i=0; i<nrow-1; i++){ for(var j = 0;j <ncol-1;j++){\
    \ rv += `${snip.tabstop(order)} & `; order ++;} rv += ` ${snip.tabstop(order)}\
    \ \\\\\\\\`+ `\\\\`+ `\\n` + `\t`; order ++;} for(var j = 0;j <ncol-1;j++){ rv\
    \ += `${snip.tabstop(order)} & `; order ++;} rv += ` ${snip.tabstop(order)} \\\
    \\\\\\`+ `\\\\`;``\n\\end{array}\n"
  description: Array environment
  regex: true
  target_platforms:
  - vscode
  options:
    math: true
    in_word: true
    beginning_of_line: true
- trigger: (b|p)mat([1-9]{1}) ([1-9]{1})
  replacement: "\\begin{``rv = m[1]``matrix}``\nlet order = 1;\nlet nrow = m[2];\n\
    let ncol = m[3];\nrv = `\\n`;\nfor (var i=0; i<nrow; i++){\n\trv += '\t';\n\t\
    for(var j = 0;j <ncol-1;j++){\n\t\trv += `${snip.tabstop(order)} & `;\n\t\torder\
    \ ++;\n\t}\n\trv += ` ${snip.tabstop(order)} \\\\\\\\`+ `\\\\`+ `\\n`;\n\torder\
    \ ++;\n}\n``\\end{``rv = m[1]``matrix}$0\n"
  description: Matrix environment (bmatrix or pmatrix)
  regex: true
  target_platforms:
  - vscode
  priority: 2000
  options:
    math: true
    in_word: true
    word_boundary: true
- trigger: vec([1-9])
