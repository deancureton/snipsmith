  options:
    math: true
  regex: true
- trigger: ^.*\)/
  replacement: '``let str = m[0]; str = str.slice(0, -1); let lastIndex = str.length
    - 1; let depth = 0; let i = str.length - 1; while (true) { if (str[i] == '')'')
    depth += 1; if (str[i] == ''('') depth -= 1; if (depth == 0) break; i -= 1; }
    let results = str.slice(0, i) + "\\frac{" + str.slice(i+1, -1) + "}"; rv = results;``{$1}$0'
  description: Fraction with parentheses
  target_platforms:
  - vscode
  options:
    math: true
  regex: true
- trigger: '([a-zA-Z]+)([0-9]+) '
  replacement: '``if ( m[2].length == 1 ) { a = ''_''; b = '' ''; } else { a = ''_{'';
