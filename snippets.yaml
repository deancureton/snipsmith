# this file is the single source of truth for all snippets.
# it's used by build_snippets.py to generate platform-specific snippet files.
# the build script validates this file before writing anything; run
# `make check` to validate without writing.

# schema:
#
# variables: <object> (optional) a key-value store for variables that can be referenced in triggers and replacements using {{variable_name}}. the build script substitutes the values directly for vscode; for obsidian triggers it emits obsidian's native `${VAR}` format and generates a variables file.
#
# defaults: <object> (optional)
#   options: <object> default options applied to every snippet. a snippet's own
#     options (and then its platform overrides) are merged on top, so any
#     default can be overridden per snippet (e.g. `auto: false`).
#
# snippets:
#   - trigger: <string> the text that activates the snippet. in single quotes to prevent escape characters.
#     regex: <boolean> (default: false) whether the trigger should be treated as a regex pattern or plaintext.
#       in regex replacements, use [[n]] to reference capture groups ([[0]] is
#       the first group). for vscode, [[n]] is automatically translated to an
#       hsnips javascript block (``rv = m[n+1]``); only write a platform
#       override when the vscode replacement genuinely differs.
#     replacement: <string> the content to be inserted. in double quotes to allow for escape characters.
#       use $1, $2 for tab stops. dynamic/scripted snippets are not processed
#       by the build script; put those in verbatim_snippets instead.
#     description: <string> (optional) a short explanation of what the snippet does. no double quotes (they would corrupt the hsnips file).
#     target_platforms: <array> (optional) a list of platforms to target (e.g., [obsidian, vscode]).
#       if omitted, the snippet will be generated for all platforms.
#     priority: <number> (optional) (default: 0) the priority of the snippet. higher priority snippets triggered first.
#     options:
#       math: <boolean> (default: false) snippet is active only in math contexts.
#       inline_math: <boolean> (default: false) snippet is active only in inline math contexts. obsidian only.
#       display_math: <boolean> (default: false) snippet is active only in display math contexts. obsidian only.
#       text: <boolean> (default: false) snippet is active only in non-math/text contexts.
#       code: <boolean> (default: false) snippet is active only in code blocks. obsidian only.
#       auto: <boolean> (default: false; set to true for this file via defaults) should the snippet trigger automatically.
#       visual: <boolean> (default: false) for snippets that operate on selected text. obsidian only.
#       in_word: <boolean> (default: true) allow snippet to trigger inside a word (vscode's 'i' flag). vscode only.
#       word_boundary: <boolean> (default: false) trigger only on word boundaries (vscode's 'w' flag; obsidian's 'w' option).
#       beginning_of_line: <boolean> (default: false) trigger only at the beginning of a line (vscode's 'b' flag). vscode only.
#       multi_line: <boolean> (default: false) trigger on multiple lines (vscode's 'M' flag). vscode only.
#     platforms: <object> (optional) platform-specific overrides.
#       obsidian: <object> override trigger/regex/replacement/description/priority/options for obsidian.
#       vscode: <object> override trigger/regex/replacement/description/priority/options for vscode.
#
# verbatim_snippets: <object> (optional) a key-value store for platform-specific
#   verbatim snippets. these will be appended to the generated snippet files
#   without any processing. use this for dynamic/scripted snippets.
#   obsidian: <array> a list of verbatim snippets for obsidian.
#   vscode: <array> a list of verbatim snippets for vscode.

variables:
  GREEK: alpha|beta|gamma|Gamma|delta|Delta|epsilon|varepsilon|zeta|eta|theta|Theta|iota|kappa|lambda|Lambda|mu|nu|omicron|xi|Xi|pi|Pi|rho|sigma|Sigma|tau|upsilon|Upsilon|varphi|phi|Phi|chi|psi|Psi|omega|Omega
  SYMBOL: cdot|cdots|sum|prod|cap|cup|iff|ell|mid|subset|supset|notin|sim|hbar|infty|leftrightarrow|mapsto|setminus|bigcap|bigcup|land|lor|subseteq|supseteq|implies|impliedby|exists|forall|equiv|square|neq|geq|leq|gg|ll|simeq|approx|propto|oplus|otimes|times|star|perp|det|adj|exp|ln|log|partial|circ|deg|wedge|langle|rangle|cong|max|min|nabla|Gal|Aut|Hom|im|ker|Im|Re|dim|deg|wedge|langle|rangle|cong|codim|vdots|ddots|oint|iint|iiint
  SHORT_SYMBOL: to|pm|mp
