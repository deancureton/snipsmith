  obsidian:
  - "{ trigger: /iden(\\d)/, replacement: (match) => {\n        const n = match[1];\n\
    \n        let arr = [];\n        for (let j = 0; j < n; j++) {\n            arr[j]\
    \ = [];\n            for (let i = 0; i < n; i++) {\n                arr[j][i]\
    \ = (i === j) ? 1 : 0;\n            }\n        }\n\n        let output = arr.map(el\
    \ => el.join(\" & \")).join(\" \\\\\\\\\\n\");\n        output = `\\\\begin{pmatrix}\\\
    n${output}\\n\\\\end{pmatrix}`;\n        return output;\n    }, options: \"mA\"\
    , description: \"N x N identity matrix\"}"
