name: release

# tag a commit `vX.Y.Z` (matching __version__) and push it: this updates the
# formula in the tap repo, then publishes a github release. needs a
# TAP_GITHUB_TOKEN secret with write access to deancureton/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check tag matches package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/snipsmith/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: deancureton/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: update tap formula
        run: |
          cp Formula/snipsmith.rb tap/Formula/snipsmith.rb
          scripts/update-formula.sh "$GITHUB_REF_NAME" tap/Formula/snipsmith.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/snipsmith.rb
          git commit -m "snipsmith ${GITHUB_REF_NAME#v}"
          git push

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
